# =====================================================================
#  muteebalam.com — nginx virtual host (final, HTTPS)
#
#  Static single-page portfolio for Syed Muteeb Alam.
#  Certificate: Let's Encrypt / certbot, HTTP-01 via webroot.
#
#  Install at : /etc/nginx/sites-available/muteebalam.com.conf
#  Enable with: ln -s ../sites-available/muteebalam.com.conf \
#                     /etc/nginx/sites-enabled/muteebalam.com.conf
#
#  NOTE: security headers are declared once at server level. Nested
#  locations deliberately avoid `add_header` so they inherit them
#  (nginx drops inherited add_header directives if a location declares
#  its own). Caching is controlled with `expires` instead.
# =====================================================================

# ── HTTP : ACME challenge + redirect ─────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name muteebalam.com www.muteebalam.com;

    # Certbot webroot. Must stay plain HTTP and never redirect.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/letsencrypt;
        default_type "text/plain";
        try_files    $uri =404;
        access_log   off;
    }

    location / {
        return 301 https://muteebalam.com$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name muteebalam.com;

    root  /var/www/muteebalam.com;
    index index.html;

    # ── TLS ──────────────────────────────────────────────────────────
    ssl_certificate         /etc/letsencrypt/live/muteebalam.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/muteebalam.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/muteebalam.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:MuteebAlamSSL:10m;
    ssl_session_tickets       off;

    # ── Headers (inherited by every location) ────────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    charset       utf-8;
    server_tokens off;
    keepalive_timeout 65;

    # ── Routing ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # ── Caching ──────────────────────────────────────────────────────
    # Immutable hashed-free assets: cache hard for 30 days.
    location ~* \.(?:woff2|woff|ttf|otf|jpg|jpeg|png|webp|avif|svg|ico)$ {
        expires    30d;
        access_log off;
        try_files  $uri =404;
    }

    # Stylesheets and scripts change with deploys: 1 day + revalidate.
    location ~* \.(?:css|js)$ {
        expires    1d;
        access_log off;
        try_files  $uri =404;
    }

    # The document itself must always revalidate.
    location = /index.html {
        expires -1;
    }

    # ── Hardening ────────────────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt  { access_log off; log_not_found off; expires 1d; }
    location = /sitemap.xml { access_log off; log_not_found off; expires 1d; }
    location = /favicon.svg { access_log off; expires 7d; }
}

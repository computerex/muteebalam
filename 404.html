<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b12">
<meta name="robots" content="noindex, follow">
<title>Page not found — Syed Muteeb Alam</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  .err {
    position: relative;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(24px, 6vw, 64px) var(--gutter);
    text-align: center;
    overflow: clip;
  }
  .err::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(600px 320px at 50% 0%, rgba(46,230,197,0.14), transparent 70%),
      radial-gradient(480px 260px at 80% 100%, rgba(79,140,255,0.11), transparent 72%);
    pointer-events: none;
  }
  .err-inner { position: relative; max-width: 620px; }
  .err-code {
    font-family: var(--font-mono);
    font-size: clamp(4rem, 17vw, 9rem);
    font-weight: 600;
    line-height: 0.9;
    letter-spacing: -0.05em;
    background: linear-gradient(120deg, #2ee6c5, #4f8cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .err h1 {
    margin-top: 12px;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    letter-spacing: -0.028em;
  }
  .err p {
    margin: 14px auto 0;
    max-width: 42ch;
    color: var(--text-2);
  }
  .err-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
  }
  .err-mono {
    margin-top: 34px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: var(--text-3);
    opacity: 0.75;
  }
</style>
</head>
<body>
<main class="err">
  <div class="err-inner">
    <p class="err-code">404</p>
    <h1>This route doesn't resolve.</h1>
    <p>
      The page you were looking for isn't here — it may have moved, or the link
      may be out of date.
    </p>
    <div class="err-actions">
      <a class="btn btn--primary" href="/">
        Back to home
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="btn btn--ghost" href="/#certifications">View certifications</a>
    </div>
    <p class="err-mono">muteebalam.com</p>
  </div>
</main>
</body>
</html>

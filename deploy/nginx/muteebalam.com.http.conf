# =====================================================================
# muteebalam.com — nginx virtual host (bootstrap, HTTP only)
#
# Used ONLY for the first pass so that certbot's HTTP-01 challenge can
# be answered. Once the certificate exists, deploy/nginx/muteebalam.com.conf
# replaces this file.
# Install at: /etc/nginx/sites-available/muteebalam.com.conf
# =====================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name muteebalam.com www.muteebalam.com;

    root  /var/www/muteebalam.com;
    index index.html;

    # Certbot webroot — must remain plain HTTP and must not redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files    $uri =404;
        access_log   off;
    }

    # Everything else goes to HTTPS.
    location / {
        return 301 https://muteebalam.com$request_uri;
    }
}
